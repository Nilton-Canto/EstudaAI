name: CI - EstudaAI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file
      working-directory: ./config
      run: |
        echo "GEMINI_API_KEY=test_key_for_ci" > .env
        echo "DEBUG=True" >> .env
        echo "SECRET_KEY=test-secret-key-for-ci-only-$(openssl rand -hex 32)" >> .env
    
    - name: Create logs directory
      run: mkdir -p config/logs
    
    - name: Run migrations
      working-directory: ./config
      run: python manage.py migrate --noinput
    
    - name: Seed database with test data
      working-directory: ./config
      run: python manage.py seed_db
    
    - name: Run tests with coverage
      working-directory: ./config
      run: |
        pytest --cov=. \
               --cov-report=xml \
               --cov-report=html \
               --cov-report=term-missing \
               --cov-fail-under=50 \
               -v
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: |
          ./config/coverage.xml
          ./config/htmlcov/

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Check code formatting with Black
      run: black --check --diff config/
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: isort --check-only --diff config/
      continue-on-error: true
    
    - name: Lint with Flake8
      run: |
        flake8 config/usuarios config/api config/config \
               --config=setup.cfg \
               --count \
               --statistics \
               --exit-zero

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit for security analysis
      run: |
        bandit -r config/ \
               --skip B101,B608,B105,B106 \
               --exclude config/migrations,config/venv,config/.venv,config/__pycache__ \
               --format json \
               --output bandit-report.json \
               || true
    
    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json

    - name: Run Safety to check for vulnerable dependencies
      run: safety check --file requirements.txt --continue-on-error || true