services:
  mysql:
    image: mysql:8.0
    container_name: estudaai-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: estudaai
      MYSQL_USER: estuda
      MYSQL_PASSWORD: estuda
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: unless-stopped
