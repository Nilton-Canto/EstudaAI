
{% block content %}
    <div class="card">
        <div class="card-header">
            <h5 class="card-title">Accessar sua Conta</h5>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Entrada</button>
            </form>
        </div>
    </div>
{% endblock %}
