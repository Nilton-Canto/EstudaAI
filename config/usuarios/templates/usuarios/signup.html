{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - EstudaAI</title>
    <link rel="stylesheet" href="{% static 'usuarios/login-style.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2 class="login-title">Cadastro</h2>
            <p class="login-subtitle">Crie sua conta no EstudaAI</p>
            
            {% if messages %}
                {% for message in messages %}
                    <p style="color: {% if message.tags == 'success' %}green{% else %}red{% endif %}; margin-bottom: 1rem;">
                        {{ message }}
                    </p>
                {% endfor %}
            {% endif %}
            
            <form method="post" class="login-form">
                {% csrf_token %}
                
                <div>
                    <input type="text" name="username" class="input-field" placeholder="Nome de usuário" required>
                </div>
                <div>
                    <input type="text" name="nome" class="input-field" placeholder="Nome completo" required>
                </div>
                <div>
                    <input type="email" name="email" class="input-field" placeholder="Email" required>
                </div>
                <div>
                    <input type="text" name="universidade" class="input-field" placeholder="Universidade" required>
                </div>
                <div>
                    <input type="text" name="curso" class="input-field" placeholder="Curso" required>
                </div>
                <div>
                    <input type="number" name="ano_formatura" class="input-field" placeholder="Ano de formatura">
                </div>
                <div>
                    <input type="number" name="idade" class="input-field" placeholder="Idade">
                </div>
                <div>
                    <input type="password" name="password" class="input-field" placeholder="Senha" required>
                </div>
                
                <button type="submit" class="btn-primary">Criar conta</button>
            </form>
            
            <div class="login-register">
                <span>Já tem conta? </span>
                <a href="{% url 'login' %}" class="register-link">Faça login</a>
            </div>
        </div>
    </div>
</body>
</html>
