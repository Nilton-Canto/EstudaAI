{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstudaAI - Minhas Trilhas</title>
  <link rel="stylesheet" href="{% static 'usuarios/minhastrilhas-style.css' %}">
</head>
<body class="bg">
  <header class="navbar">
    <nav>
      <a href="#" class="logo">EstudaAI</a>
      <ul class="menu">
        <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
        <li><a href="#" class="active">Minhas Trilhas</a></li>
        <li><a href="{% url 'criar_trilha' %}">Criar Trilha</a></li>
      </ul>
      <div class="user">
        <span>Olá, <strong>{{ user.nome|default:user.username }}</strong></span>
        {% if user.is_staff %}
        <a href="{% url 'admin_dashboard' %}" style="margin-left: 1rem; padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); border-radius: 0.5rem; text-decoration: none; color: white;">Admin</a>
        {% endif %}
        <a href="{% url 'logout' %}" style="margin-left: 0.5rem; padding: 0.5rem 1rem; background: rgba(239,68,68,0.9); border-radius: 0.5rem; text-decoration: none; color: white;">Sair</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <h2>Minhas Trilhas</h2>
    <div class="card">
      <p>Aqui você poderá ver todas as suas trilhas...</p>
    </div>
  </main>
</body>
</html>
