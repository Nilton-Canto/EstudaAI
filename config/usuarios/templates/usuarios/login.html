<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstudaAI - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container da Tela de Login -->
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">EstudaAI</h1>
            <p class="login-subtitle">Bem-vindo!</p>
            
            <form id="login-form" class="login-form">
                <div>
                    <input 
                        type="email" 
                        placeholder="E-mail" 
                        required 
                        class="input-field"
                    >
                </div>
                <div>
                    <input 
                        type="password" 
                        placeholder="Senha" 
                        required 
                        class="input-field"
                    >
                </div>
                <!-- Botão "Entrar" será inserido aqui pelo JavaScript -->
                <div id="login-button-container"></div>
            </form>

            <p class="login-alt-text">Ou entre com</p>

            <div class="login-social">
                <button class="social-button google">
                    <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2C6.477 2 2 6.477 2 12s4.477 
                                 10 10 10c5.523 0 10-4.477 
                                 10-10S17.523 2 12 2zm3.232 
                                 10.323c-.552 0-1-.448-1-1s.448-1 
                                 1-1h.985c.552 0 1 .448 1 
                                 1s-.448 1-1 1h-.985zM8.768 
                                 12.323c-.552 0-1-.448-1-1s.448-1 
                                 1-1h.985c.552 0 1 .448 1 
                                 1s-.448 1-1 1h-.985zm.985-2.023h-1.97v4.046h1.97v-4.046z"/>
                        <path d="M12 4.414c-4.14 0-7.518 
                                 3.378-7.518 7.518s3.378 7.518 
                                 7.518 7.518 7.518-3.378 
                                 7.518-7.518S16.14 4.414 
                                 12 4.414zm0 13.032c-3.048 
                                 0-5.52-2.472-5.52-5.52s2.472-5.52 
                                 5.52-5.52 5.52 2.472 
                                 5.52 5.52-2.472 
                                 5.52-5.52 5.52zM12 
                                 8.35c-1.92 0-3.498 
                                 1.578-3.498 
                                 3.498S10.08 
                                 15.346 12 
                                 15.346s3.498-1.578 
                                 3.498-3.498S13.92 
                                 8.35 12 8.35zm0 
                                 5.48c-1.127 0-2.03-1.173-2.03-2.03S10.873 
                                 9.773 12 9.773s2.03 
                                 1.173 2.03 2.03-1.127 
                                 2.03-2.03 2.03z"/>
                    </svg>
                </button>
            </div>
            
            <p class="login-register">
                Não tem uma conta? 
                <a href="#" class="register-link">Cadastre-se</a>
            </p>
        </div>
    </div>

    <script type="module">
        function createButton(text, type = 'submit') {
            const button = document.createElement('button');
            button.type = type;
            button.textContent = text;
            button.className = "btn-primary";
            return button;
        }

        const buttonContainer = document.getElementById('login-button-container');
        const loginButton = createButton('Entrar', 'submit');
        buttonContainer.appendChild(loginButton);
    </script>
</body>
</html>
