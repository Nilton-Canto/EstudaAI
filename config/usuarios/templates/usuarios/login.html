{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EstudaAI</title>
    <link rel="stylesheet" href="{% static 'usuarios/login-style.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2 class="login-title">Login</h2>
            <p class="login-subtitle">Acesse sua conta no EstudaAI</p>
            
            {% if form.errors %}
                <p style="color: red; margin-bottom: 1rem;">Usuário ou senha inválidos. Tente novamente.</p>
            {% endif %}
            
            <form action="{% url 'usuarios:login' %}" method="post" class="login-form">
                {% csrf_token %}
                <div>
                    <input type="text" name="username" class="input-field" placeholder="Usuário" required>
                </div>
                <div>
                    <input type="password" name="password" class="input-field" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
            
            <div class="login-register">
                <span>Não tem conta? </span>
                <a href="{% url 'usuarios:signup' %}" class="register-link">Cadastre-se</a>
            </div>
        </div>
    </div>
</body>
</html>
