
{% block content %}
<h2>Login</h2>
    {% if form.errors %}
        <p style="color: red;">Usuário ou senha inválidos. Tente novamente.</p>
    {% endif %}
        <form action ="{% url 'login' %}" method= "post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button name="submit">Entrar</button>

        </form>
{% endblock %}
