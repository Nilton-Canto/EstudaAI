[flake8]
exclude = .git,__pycache__,venv,env,.venv,migrations,manage.py,settings.py
max-line-length = 88
select = C,E,F,W,B,B950
ignore = E203, E501, W503

[isort]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
skip_glob = venv,env,.venv,migrations

[bandit]
exclude_dirs = venv,env,.venv,tests,migrations
skips = B101,B608
